# 容器内 nginx：前端静态资源 + 后端接口 + 媒体裸流的统一入口。
#
# 这份配置面向本地体验，走明文 HTTP。之所以可行，是因为浏览器把 localhost
# 视为安全上下文，视频播放依赖的 WebCodecs 在 http://localhost 下可用。
# 一旦换成 IP 或域名访问，WebCodecs 将不可用，必须配 HTTPS —— 生产配置见
# deploy/nginx-jt-console.conf。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # 网关的内部接口与投递入口不对浏览器开放
    location ^~ /internal/ { return 404; }
    location ^~ /device/   { return 404; }
    location ^~ /actuator/ { return 404; }
    location ^~ /ingest/   { return 404; }

    location /api/ {
        proxy_pass http://console:8300/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 开流需要等待终端响应
        proxy_read_timeout 30s;
    }

    # 实时位置推送
    location /ws/ {
        proxy_pass http://console:8300/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 媒体裸流。网关返回的 wsUrl 会被 jt-console 改写到这个路径，
    # 避免浏览器直连媒体端口（也是 HTTPS 部署下绕开混合内容限制的方式）。
    location = /media-ws {
        proxy_pass http://gateway:7815/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 构建产物文件名带内容哈希，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html 是资源引用表，缓存住会在发版后指向已不存在的文件
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
