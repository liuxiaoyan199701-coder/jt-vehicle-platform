# Rendered by 06-enable-https.sh. Placeholders have no usable host or key.
server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    return 301 https://__PUBLIC_HOST__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PUBLIC_HOST__;

    ssl_certificate     __TLS_CERT_FILE__;
    ssl_certificate_key __TLS_KEY_FILE__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:JTConsoleTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/jt-console/current;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # Internal gateway, ingest and management surfaces never cross Nginx.
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /device { return 404; }
    location ^~ /device/ { return 404; }
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /ingest { return 404; }
    location ^~ /ingest/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8300/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8300/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    location = /media-ws {
        proxy_pass http://127.0.0.1:7815/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    # 构建产物文件名带内容哈希，可以长期缓存。注意 Nginx 的 add_header 不跨层级
    # 继承：本块一旦声明任何 add_header，server 级的安全响应头就不再下发，
    # 因此这里必须重复声明。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # index.html 引用的是带哈希的资源名。一旦它被缓存住，发布新版本后浏览器仍会
    # 按旧 HTML 去请求已经不存在的旧文件，页面直接白屏。所以它必须每次回源校验。
    # location / 的 try_files 回退到 /index.html 属于内部重定向，会重新匹配到这里。
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
