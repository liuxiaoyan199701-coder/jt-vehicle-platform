name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zero-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test JT/T gateway and media platform
        working-directory: jt-platform
        run: mvn -B -ntp test
      - name: Test management console backend
        working-directory: jt-console
        run: mvn -B -ntp test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/jt-player/package-lock.json
      - name: Install player dependencies
        working-directory: packages/jt-player
        run: npm ci
      - name: Test and build player SDK
        working-directory: packages/jt-player
        run: npm test && npm run typecheck && npm run build
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: jt-console-ui/pnpm-lock.yaml
      - name: Install console UI dependencies from lockfile
        working-directory: jt-console-ui
        run: pnpm install --frozen-lockfile
      - name: Type-check and build console UI
        working-directory: jt-console-ui
        run: pnpm typecheck && pnpm build
      - name: Validate active OpenSpec change
        run: npx --yes @fission-ai/openspec@1.3.0 validate harden-console-foundation --strict
