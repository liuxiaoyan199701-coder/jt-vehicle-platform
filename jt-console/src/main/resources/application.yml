server:
  port: 8300
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "127.0.0.1/32, ::1/128"

spring:
  application:
    name: jt-console

  datasource:
    # WAL 让读写可以并发；busy_timeout 避免瞬时写锁冲突直接抛错。
    url: jdbc:sqlite:${JT_CONSOLE_DB:data/jt-console.db}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 同一时刻只允许一个写事务，连接池开大只会加剧锁竞争。
      maximum-pool-size: 4
      pool-name: jt-console-pool

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      # AI 对话图片与 OTA 升级包都走 multipart。升级包可达 64MB，容器上限取两者较大值；
      # 各自的业务上限仍由业务层（AttachmentStore / UpgradePackageStore）把守，
      # 让超限由业务层给出中文提示，而不是被容器以一个没有上下文的 413 拦掉。
      max-file-size: ${JT_MULTIPART_MAX_SIZE:128MB}
      max-request-size: 140MB

jt:
  console:
    # jt-platform 网关地址。开流请求由后端代理转发，前端不直连网关。
    gateway:
      base-url: ${JT_GATEWAY_BASE_URL:http://127.0.0.1:8100}
      connect-timeout: 3s
      request-timeout: 8s
    # 超过该时长没有收到任何消息即判定离线
    offline-timeout: 5m
    # 幂等表保留时长，超过即清理
    event-retention: 24h
    security:
      deployment-mode: ${JT_CONSOLE_DEPLOYMENT_MODE:false}
      admin-username: ${JT_CONSOLE_ADMIN_USERNAME:admin}
      # 部署模式必须从受限环境文件提供 BCrypt 哈希；本地留空时生成一次性密码。
      admin-password-hash: ${JT_CONSOLE_ADMIN_PASSWORD_HASH:}
      # 与管理员会话完全独立；本地留空时生成临时高熵投递密钥。
      ingest-key: ${JT_CONSOLE_INGEST_KEY:}
      # 访问令牌 7 天：管理后台面向少量运维人员，配合刷新令牌（7 天）与登录限流，
      # 长有效期可以避免频繁重新登录；token 泄露风险由后续的轮换/撤销机制收敛
      access-token-ttl: ${JT_CONSOLE_ACCESS_TOKEN_TTL:7d}
      refresh-token-ttl: ${JT_CONSOLE_REFRESH_TOKEN_TTL:7d}
      allowed-origins: ${JT_CONSOLE_ALLOWED_ORIGINS:http://localhost:9527,http://127.0.0.1:9527}
      rate-limit:
        max-failures: ${JT_CONSOLE_AUTH_MAX_FAILURES:5}
        window: ${JT_CONSOLE_AUTH_FAILURE_WINDOW:1m}
        block-duration: ${JT_CONSOLE_AUTH_BLOCK_DURATION:5m}
        max-entries: ${JT_CONSOLE_AUTH_MAX_ENTRIES:10000}
    broadcast:
      dispatch-queue-capacity: ${JT_CONSOLE_BROADCAST_QUEUE_CAPACITY:1024}
      session-queue-capacity: ${JT_CONSOLE_SESSION_QUEUE_CAPACITY:64}
      worker-threads: ${JT_CONSOLE_BROADCAST_WORKER_THREADS:2}
      send-timeout: ${JT_CONSOLE_WS_SEND_TIMEOUT:5s}
    operations:
      # 运营自然日、七日趋势和位置日汇总不依赖服务器默认时区。
      zone-id: ${JT_CONSOLE_OPERATIONS_ZONE_ID:Asia/Shanghai}
    geo:
      # 高德「Web服务」类型 key，用于服务端逆地理编码（坐标转地址）。
      # 与 tenancy.amap-key 不是同一个：那是浏览器里用的 JS API key，
      # 拿它调 restapi.amap.com 会返回 USERKEY_PLAT_NOMATCH。留空则不带地址，功能降级不报错。
      amap-web-service-key: ${JT_CONSOLE_AMAP_WEB_KEY:}
    ai:
      # 是否启用由「有没有装配出模型 bean」决定，见文件末尾的 spring.ai.model.chat。
      # 这里只放平台自己的策略参数。
      max-tool-rounds: ${JT_AI_MAX_TOOL_ROUNDS:8}
      concurrent-chats: ${JT_AI_CONCURRENT_CHATS:4}
      vision:
        # 视觉旁路模型：主模型（DeepSeek）没有视觉能力，由它专门负责「看图出文字」，
        # 描述再作为普通文本进入主模型上下文。留空则整条视觉链路关闭：
        # 相关工具不注册、图片上传接口明确拒绝，功能少一个而不是报错。
        # 用 OpenAI 兼容接口，只需要 /v1/chat/completions。
        base-url: ${JT_AI_VISION_BASE_URL:}
        api-key: ${JT_AI_VISION_API_KEY:}
        model: ${JT_AI_VISION_MODEL:}
        timeout: ${JT_AI_VISION_TIMEOUT:60s}
        max-images: ${JT_AI_VISION_MAX_IMAGES:4}
        max-edge-pixels: ${JT_AI_VISION_MAX_EDGE:1280}
      attachment:
        # 用户在对话里发的图片。存盘不入库——一张手机照片几 MB，
        # base64 进 SQLite 会把 findMessages 的响应体撑爆。
        directory: ${JT_AI_ATTACHMENT_DIR:data/console/ai-attachments}
        max-size: ${JT_AI_ATTACHMENT_MAX_SIZE:8MB}
        retention: ${JT_AI_ATTACHMENT_RETENTION:30d}
    connection-diagnostics:
      retention: ${JT_CONSOLE_CONNECTION_RETENTION:14d}
      cleanup-batch-size: ${JT_CONSOLE_CONNECTION_CLEANUP_BATCH:500}
      cleanup-max-batches: ${JT_CONSOLE_CONNECTION_CLEANUP_MAX_BATCHES:100}
      cleanup-cron: ${JT_CONSOLE_CONNECTION_CLEANUP_CRON:0 41 3 * * *}
    audit:
      # 审计写入永不阻塞业务：队列满时丢弃并计数，可在 /api/diagnostics 观察积压。
      queue-capacity: ${JT_CONSOLE_AUDIT_QUEUE_CAPACITY:4096}
      retention: ${JT_CONSOLE_AUDIT_RETENTION:180d}
      cleanup-batch-size: ${JT_CONSOLE_AUDIT_CLEANUP_BATCH:500}
      cleanup-max-batches: ${JT_CONSOLE_AUDIT_CLEANUP_MAX_BATCHES:100}
      # 低峰执行：SQLite 只有一个写锁，大批量删除与业务写入抢锁会体现为接口变慢。
      cleanup-cron: ${JT_CONSOLE_AUDIT_CLEANUP_CRON:0 17 3 * * *}
    registration:
      # 自助注册是公网可达的写入口，默认关闭，由部署方按商务需要显式开启。
      enabled: ${JT_CONSOLE_REGISTRATION_ENABLED:false}
      pending-expiry: ${JT_CONSOLE_REGISTRATION_PENDING_EXPIRY:30d}
      captcha-ttl: ${JT_CONSOLE_REGISTRATION_CAPTCHA_TTL:5m}
      captcha-max-entries: ${JT_CONSOLE_REGISTRATION_CAPTCHA_MAX:5000}
    tenancy:
      # 网关查询设备档案的共享密钥。与投递密钥、管理员凭据、token 相互独立；
      # 留空表示不开放该接口（网关继续用 allow-all / local-list 模式）。
      device-registry-key: ${JT_CONSOLE_DEVICE_REGISTRY_KEY:}
      expiry-scan-millis: ${JT_CONSOLE_TENANT_EXPIRY_SCAN_MILLIS:3600000}
      # 以下为全局默认值，可被租户配置覆盖（见 /api/config）。
      platform-name: ${JT_CONSOLE_PLATFORM_NAME:车联网监控平台}
      amap-key: ${JT_CONSOLE_AMAP_KEY:}
      amap-security-code: ${JT_CONSOLE_AMAP_SECURITY_CODE:}

# Spring AI 的模型配置。
#
# AI 功能的总开关就是 model.chat：默认 none 表示不装配任何模型，平台据此判定功能未启用、
# 不暴露相关接口与菜单。刻意不再另设一个 jt.console.ai.enabled 布尔——两个必须保持一致的
# 开关，迟早会有人只改其中一个，得到一个「菜单在但一点就报错」的半启用状态。
# 启用 AI 需要同时给出 JT_AI_CHAT_MODEL=deepseek 与 JT_AI_API_KEY，两者都不冗余：
# 一个选服务商，一个做鉴权。
spring.ai:
  model:
    chat: ${JT_AI_CHAT_MODEL:none}
  deepseek:
    # 密钥只从部署环境文件来，绝不写进仓库或数据库。
    api-key: ${JT_AI_API_KEY:}
    base-url: ${JT_AI_BASE_URL:https://api.deepseek.com}
    chat:
      options:
        model: ${JT_AI_MODEL:deepseek-v4-flash}
        temperature: ${JT_AI_TEMPERATURE:0.3}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    io.github.jtconsole: INFO
