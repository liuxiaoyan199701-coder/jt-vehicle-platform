<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <!--
    刻意画成浅底而不是透明底：README 里的 SVG 会贴着阅读器的页面背景渲染，
    透明底 + 深色文字在深色模式下就是一片看不见。固定浅底两种模式下都一样清楚。
  -->
  <rect width="1120" height="800" fill="#fbfcfd"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="21" font-weight="600" fill="#12171d">车联网监控平台 · 系统架构</text>
  <text x="40" y="66" font-size="13" fill="#5b6b7a">终端按 JT/T 808 接入信令，视频按 JT/T 1078 直连媒体节点；业务侧零外部中间件依赖</text>

  <!-- ============ 终端与客户端 ============ -->
  <rect x="36" y="92" width="1048" height="96" rx="8" fill="#ffffff" stroke="#d9e0e6" stroke-dasharray="4 3"/>
  <text x="52" y="114" font-size="12" font-weight="600" fill="#8593a0">终端与客户端</text>

  <rect x="72" y="124" width="230" height="46" rx="6" fill="#eef4fb" stroke="#b9d2ea"/>
  <text x="187" y="146" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">JT/T 808 终端</text>
  <text x="187" y="163" font-size="11" fill="#5b6b7a" text-anchor="middle">位置汇报 · 告警 · 应答</text>

  <rect x="330" y="124" width="230" height="46" rx="6" fill="#eef4fb" stroke="#b9d2ea"/>
  <text x="445" y="146" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">JT/T 1078 车载视频</text>
  <text x="445" y="163" font-size="11" fill="#5b6b7a" text-anchor="middle">H.264/265 · AAC/G.711A</text>

  <rect x="588" y="124" width="230" height="46" rx="6" fill="#f2f7f4" stroke="#bcd9c9"/>
  <text x="703" y="146" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">浏览器（Vue 3）</text>
  <text x="703" y="163" font-size="11" fill="#5b6b7a" text-anchor="middle">监控 · 回放 · 播放 · AI 对话</text>

  <rect x="846" y="124" width="202" height="46" rx="6" fill="#f2f7f4" stroke="#bcd9c9"/>
  <text x="947" y="146" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">第三方业务系统</text>
  <text x="947" y="163" font-size="11" fill="#5b6b7a" text-anchor="middle">REST · 消息订阅</text>

  <!-- ============ 接入网关 ============ -->
  <rect x="36" y="252" width="1048" height="166" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
  <text x="52" y="274" font-size="12" font-weight="600" fill="#1d6fb8">接入网关 jt-platform · 同一个 JAR，按角色启动</text>

  <rect x="72" y="288" width="292" height="94" rx="6" fill="#eaf2fa" stroke="#9dc0e0"/>
  <text x="218" y="311" font-size="15" font-weight="600" fill="#12171d" text-anchor="middle">jt-signal</text>
  <text x="218" y="331" font-size="11" fill="#41505e" text-anchor="middle">808 会话 · 注册鉴权 · 指令下发</text>
  <text x="218" y="348" font-size="11" fill="#41505e" text-anchor="middle">分包重组 · 设备路由</text>
  <text x="218" y="369" font-size="11" font-weight="600" fill="#1d6fb8" text-anchor="middle">7100/TCP · 7101/UDP · 71N3 内部</text>

  <rect x="392" y="288" width="292" height="94" rx="6" fill="#eaf2fa" stroke="#9dc0e0"/>
  <text x="538" y="311" font-size="15" font-weight="600" fill="#12171d" text-anchor="middle">jt-media</text>
  <text x="538" y="331" font-size="11" fill="#41505e" text-anchor="middle">1078 收流 · 裸流转发 · 对讲</text>
  <text x="538" y="348" font-size="11" fill="#41505e" text-anchor="middle">分片录像 · 回放 · MP4 导出 → 本地磁盘</text>
  <text x="538" y="369" font-size="11" font-weight="600" fill="#1d6fb8" text-anchor="middle">78N1–78N4 接入 · 78N5 播放</text>

  <rect x="712" y="288" width="336" height="94" rx="6" fill="#eaf2fa" stroke="#9dc0e0"/>
  <text x="880" y="311" font-size="15" font-weight="600" fill="#12171d" text-anchor="middle">jt-api</text>
  <text x="880" y="331" font-size="11" fill="#41505e" text-anchor="middle">开流调度 · 一次性媒体 token</text>
  <text x="880" y="348" font-size="11" fill="#41505e" text-anchor="middle">媒体实例注册表（内存）· 容量指标</text>
  <text x="880" y="369" font-size="11" font-weight="600" fill="#1d6fb8" text-anchor="middle">8100 REST · 8109 管理</text>

  <!-- ============ 业务控制台 ============ -->
  <rect x="36" y="466" width="1048" height="152" rx="8" fill="#ffffff" stroke="#c6ddd0"/>
  <text x="52" y="488" font-size="12" font-weight="600" fill="#2e7d5b">业务控制台 jt-console · 独立进程，SQLite 单库，零外部中间件</text>

  <rect x="72" y="502" width="228" height="98" rx="6" fill="#eef7f2" stroke="#a9d3bd"/>
  <text x="186" y="525" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">ingest 投递入口</text>
  <text x="186" y="545" font-size="11" fill="#41505e" text-anchor="middle">位置 · 批量补传 · 告警</text>
  <text x="186" y="562" font-size="11" fill="#41505e" text-anchor="middle">多媒体 · 幂等去重</text>
  <text x="186" y="583" font-size="11" fill="#41505e" text-anchor="middle">坐标换算 · 逆地理 · 日统计</text>

  <rect x="328" y="502" width="228" height="98" rx="6" fill="#eef7f2" stroke="#a9d3bd"/>
  <text x="442" y="525" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">operations 运营</text>
  <text x="442" y="545" font-size="11" fill="#41505e" text-anchor="middle">实时监控 · 轨迹回放</text>
  <text x="442" y="562" font-size="11" fill="#41505e" text-anchor="middle">告警处置 · 电子围栏</text>
  <text x="442" y="583" font-size="11" fill="#41505e" text-anchor="middle">车队 · 车辆档案 · 看板</text>

  <rect x="584" y="502" width="228" height="98" rx="6" fill="#eef7f2" stroke="#a9d3bd"/>
  <text x="698" y="525" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">iam 多租户与权限</text>
  <text x="698" y="545" font-size="11" fill="#41505e" text-anchor="middle">租户 · 部门 · 角色 · 岗位</text>
  <text x="698" y="562" font-size="11" fill="#41505e" text-anchor="middle">套餐配额 · 会话持久化</text>
  <text x="698" y="583" font-size="11" fill="#41505e" text-anchor="middle">数据范围 DataScope · 审计</text>

  <rect x="840" y="502" width="208" height="98" rx="6" fill="#f6f1fb" stroke="#c9b6de"/>
  <text x="944" y="525" font-size="14" font-weight="600" fill="#12171d" text-anchor="middle">ai 助手</text>
  <text x="944" y="545" font-size="11" fill="#41505e" text-anchor="middle">流式对话 · 工具调用</text>
  <text x="944" y="562" font-size="11" fill="#41505e" text-anchor="middle">动作提议（需确认）</text>
  <text x="944" y="583" font-size="11" fill="#41505e" text-anchor="middle">内嵌地图 / 图表 / 视频</text>

  <!-- ============ 存储与外部 ============ -->
  <rect x="36" y="662" width="1048" height="96" rx="8" fill="#ffffff" stroke="#d9e0e6" stroke-dasharray="4 3"/>
  <text x="52" y="684" font-size="12" font-weight="600" fill="#8593a0">存储与外部服务</text>

  <rect x="72" y="694" width="228" height="50" rx="6" fill="#fdf6ec" stroke="#e8d3a9"/>
  <text x="186" y="714" font-size="12.5" fill="#12171d" text-anchor="middle">高德 Web 服务</text>
  <text x="186" y="732" font-size="11" fill="#5b6b7a" text-anchor="middle">逆地理编码（服务端）</text>

  <rect x="328" y="694" width="228" height="50" rx="6" fill="#f4f6f8" stroke="#ccd6df"/>
  <text x="442" y="714" font-size="12.5" fill="#12171d" text-anchor="middle">SQLite 单文件库</text>
  <text x="442" y="732" font-size="11" fill="#5b6b7a" text-anchor="middle">全部模块共用</text>

  <rect x="840" y="694" width="208" height="50" rx="6" fill="#fdf6ec" stroke="#e8d3a9"/>
  <text x="944" y="714" font-size="12.5" fill="#12171d" text-anchor="middle">DeepSeek（可选）</text>
  <text x="944" y="732" font-size="11" fill="#5b6b7a" text-anchor="middle">未配置则 AI 功能关闭</text>

  <!-- ============ 连线 ============ -->
  <!-- 808 终端 -> signal -->
  <path d="M187,170 L187,288" stroke="#1d6fb8" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <rect x="196" y="215" width="126" height="18" rx="3" fill="#fbfcfd"/>
  <text x="200" y="228" font-size="11" fill="#1d6fb8">7100/TCP · 7101/UDP</text>

  <!-- 1078 车机 -> media -->
  <path d="M445,170 L445,288" stroke="#1d6fb8" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <rect x="454" y="215" width="150" height="18" rx="3" fill="#fbfcfd"/>
  <text x="458" y="228" font-size="11" fill="#1d6fb8">RTP 直连 · 78N1–78N4</text>

  <!-- 浏览器 -> media（裸流直连） -->
  <path d="M660,170 L660,240 L600,240 L600,288" stroke="#1d6fb8" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#ab)"/>
  <rect x="606" y="188" width="176" height="18" rx="3" fill="#fbfcfd"/>
  <text x="610" y="201" font-size="11" fill="#1d6fb8">裸流 WebSocket 78N5（直连）</text>

  <!-- 第三方业务系统 -> api -->
  <path d="M947,170 L947,288" stroke="#5b6b7a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="956" y="215" width="118" height="18" rx="3" fill="#fbfcfd"/>
  <text x="960" y="228" font-size="11" fill="#41505e">开流调度 REST</text>

  <!-- api -> signal 内部指令：绕到方框下方，不横穿 jt-media -->
  <path d="M880,382 L880,400 L150,400 L150,384" stroke="#5b6b7a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="440" y="391" width="200" height="18" rx="3" fill="#ffffff"/>
  <text x="444" y="404" font-size="11" fill="#41505e">71N3 内部指令下发 9101 / 9102</text>

  <!-- signal -> console 投递 -->
  <path d="M260,382 L260,502" stroke="#2e7d5b" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <rect x="269" y="432" width="212" height="18" rx="3" fill="#fbfcfd"/>
  <text x="273" y="445" font-size="11" font-weight="600" fill="#2e7d5b">jt-delivery：HTTP API / RocketMQ</text>

  <!-- 浏览器 -> console：走最右侧走廊，不穿 jt-api -->
  <path d="M760,170 L760,212 L1066,212 L1066,470" stroke="#2e7d5b" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <rect x="898" y="432" width="170" height="18" rx="3" fill="#fbfcfd"/>
  <text x="902" y="445" font-size="11" fill="#2e7d5b">HTTPS · REST / SSE / WS</text>

  <!-- console -> 存储与外部 -->
  <path d="M186,600 L186,694" stroke="#5b6b7a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M442,600 L442,694" stroke="#5b6b7a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M944,600 L944,694" stroke="#5b6b7a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <text x="40" y="786" font-size="11" fill="#8593a0">实线为常态数据流，虚线为客户端直连媒体节点的裸流通道——调度结果指向具体节点，不能再经普通负载均衡转发。浏览器另会直接加载高德 JS API 渲染地图。</text>
</svg>
